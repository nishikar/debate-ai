<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debate AI - LiveKit Client</title>
    <script src="https://unpkg.com/livekit-client/dist/livekit-client.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 800px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 24px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 14px;
        }
        
        .status {
            padding: 12px 24px;
            background: #f7fafc;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #4a5568;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #cbd5e0;
        }
        
        .status-dot.connected {
            background: #48bb78;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            background: #f7fafc;
        }
        
        .message {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
        }
        
        .message.user {
            align-items: flex-end;
        }
        
        .message.ai {
            align-items: flex-start;
        }
        
        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 15px;
            line-height: 1.5;
        }
        
        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .message.ai .message-content {
            background: white;
            color: #2d3748;
            border: 1px solid #e2e8f0;
        }
        
        .message-label {
            font-size: 12px;
            color: #718096;
            margin-bottom: 4px;
            font-weight: 500;
        }
        
        .input-container {
            padding: 24px;
            background: white;
            border-top: 1px solid #e2e8f0;
        }
        
        .connect-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .input-group {
            display: flex;
            gap: 12px;
        }
        
        input[type="text"], input[type="url"] {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.2s;
        }
        
        input[type="text"]:focus, input[type="url"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .chat-form {
            display: flex;
            gap: 12px;
        }
        
        .hidden {
            display: none;
        }
        
        .audio-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #48bb78;
        }
        
        .audio-bar {
            width: 3px;
            height: 12px;
            background: #48bb78;
            border-radius: 2px;
            animation: audioWave 0.8s ease-in-out infinite;
        }
        
        .audio-bar:nth-child(2) { animation-delay: 0.1s; }
        .audio-bar:nth-child(3) { animation-delay: 0.2s; }
        
        @keyframes audioWave {
            0%, 100% { height: 8px; }
            50% { height: 16px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎙️ Debate AI</h1>
            <p>Challenge your arguments with AI-powered critical analysis</p>
        </div>
        
        <div class="status">
            <div class="status-indicator">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Disconnected</span>
            </div>
            <div id="audioIndicator" class="audio-indicator hidden">
                <span>Playing</span>
                <div class="audio-bar"></div>
                <div class="audio-bar"></div>
                <div class="audio-bar"></div>
            </div>
        </div>
        
        <div class="messages" id="messages">
            <div class="message ai">
                <span class="message-label">AI</span>
                <div class="message-content">
                    Welcome! Connect to the LiveKit room to start debating.
                </div>
            </div>
        </div>
        
        <div class="input-container">
            <form id="connectForm" class="connect-form">
                <input 
                    type="url" 
                    id="wsUrl" 
                    placeholder="LiveKit Server URL (wss://...)"
                    value="wss://"
                    required
                >
                <input 
                    type="text" 
                    id="token" 
                    placeholder="LiveKit Token"
                    required
                >
                <button type="submit">Connect</button>
            </form>
            
            <form id="chatForm" class="chat-form hidden">
                <input 
                    type="text" 
                    id="messageInput" 
                    placeholder="Type your argument..."
                    autocomplete="off"
                >
                <button type="submit">Send</button>
            </form>
        </div>
    </div>
    
    <script>
        let room;
        let audioElement;
        
        const connectForm = document.getElementById('connectForm');
        const chatForm = document.getElementById('chatForm');
        const messageInput = document.getElementById('messageInput');
        const messages = document.getElementById('messages');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const audioIndicator = document.getElementById('audioIndicator');
        
        // Connect to LiveKit
        connectForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const wsUrl = document.getElementById('wsUrl').value;
            const token = document.getElementById('token').value;
            
            try {
                updateStatus('Connecting...', false);
                
                room = new LivekitClient.Room();
                
                // Handle incoming data (text messages)
                room.on(LivekitClient.RoomEvent.DataReceived, (payload, participant) => {
                    const message = new TextDecoder().decode(payload);
                    addMessage('AI', message, 'ai');
                });
                
                // Handle audio tracks
                room.on(LivekitClient.RoomEvent.TrackSubscribed, (track, publication, participant) => {
                    if (track.kind === LivekitClient.Track.Kind.Audio) {
                        if (!audioElement) {
                            audioElement = track.attach();
                            document.body.appendChild(audioElement);
                        }
                        showAudioIndicator();
                    }
                });
                
                // Connect to room
                await room.connect(wsUrl, token);
                
                updateStatus('Connected', true);
                connectForm.classList.add('hidden');
                chatForm.classList.remove('hidden');
                messageInput.focus();
                
            } catch (error) {
                console.error('Connection error:', error);
                alert('Failed to connect: ' + error.message);
                updateStatus('Connection failed', false);
            }
        });
        
        // Send message
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const message = messageInput.value.trim();
            if (!message) return;
            
            addMessage('You', message, 'user');
            
            // Send message via data channel
            const encoder = new TextEncoder();
            const data = encoder.encode(message);
            await room.localParticipant.publishData(data, {
                reliable: true,
                topic: 'chat'
            });
            
            messageInput.value = '';
        });
        
        function addMessage(sender, text, type) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            const label = document.createElement('span');
            label.className = 'message-label';
            label.textContent = sender;
            
            const content = document.createElement('div');
            content.className = 'message-content';
            content.textContent = text;
            
            messageDiv.appendChild(label);
            messageDiv.appendChild(content);
            messages.appendChild(messageDiv);
            
            // Auto-scroll to bottom
            messages.scrollTop = messages.scrollHeight;
        }
        
        function updateStatus(text, connected) {
            statusText.textContent = text;
            if (connected) {
                statusDot.classList.add('connected');
            } else {
                statusDot.classList.remove('connected');
            }
        }
        
        function showAudioIndicator() {
            audioIndicator.classList.remove('hidden');
            setTimeout(() => {
                audioIndicator.classList.add('hidden');
            }, 3000);
        }
    </script>
</body>
</html>
